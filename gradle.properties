# Saffron JetBrains plugin, see README.md
pluginVersion = 0.1.2

# LSP4IJ needs 2024.2+ (build 242); no upper bound, the plugin is declarative.
pluginSinceBuild = 242

# Compile against the oldest supported platform so the API surface stays honest.
platformType = IC
platformVersion = 2024.2.5
lsp4ijVersion = 0.21.0

# The IDE bundles the Kotlin stdlib.
kotlin.stdlib.default.dependency = false
kotlin.daemon.jvmargs = -Xmx2g
org.gradle.jvmargs = -Xmx3g
org.gradle.caching = true
org.gradle.configuration-cache = true
